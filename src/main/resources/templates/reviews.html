<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reviews</title>
</head>
<body>


<form th:action="@{/saveCriteria}" th:object="${criteria}" method="post" >

    Resturaunt: <select id="resturauntName" name="resturauntName" th:field="*{restaurantName}" required="false">
                    <option value="McDonalds">McDonalds</option>
                    <option value="KFC">KFC</option>
                    <option value="Burger King">Burger King</option>
                    <option value="Shake Dog">Shake Dog</option>
                    <option value="Nandos">Nandos</option>
                </select><br>

    Anything Over <input type="number" th:field="*{rating}" id="rating" name="rating" required="false"> Stars

    <input type="submit" value="Update Criteria">
</form>

<table id="reviewsTable">
    <thead>
        <tr>
            <td>Restaurant Name</td>
            <td>Rating</td>
            <td>Review</td>
            <td>Address</td>
            <td>Item Ordered</td>
            <td>Open Hours</td>
            <td>Delivery Available</td>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    var url = new URL("http://localhost:8080/reviewStream");
    //An EventSource instance opens a persistent connection to an HTTP server, which issues server sent events
    var source = new EventSource(url);

    ///Source from
    source.onopen = function () {
        console.log('A connection to the stream has been opened');
    }

    source.onerror = function (error) {
        console.log('An error has occurred while receiving stream data', error);
        source.close();
    }

    source.onmessage = function (event) {
        console.log('received event', event);
        var data = event.data;
        var json = JSON.parse(data);

        var table = document.getElementById("reviewsTable").getElementsByTagName('tbody')[0];
        var newRow = table.insertRow();

        var cell1 = newRow.insertCell(0);
        var cell2 = newRow.insertCell(1);
        var cell3 = newRow.insertCell(2);
        var cell4 = newRow.insertCell(3);
        var cell5 = newRow.insertCell(4);
        var cell6 = newRow.insertCell(5);
        var cell7 = newRow.insertCell(6);

        cell1.innerHTML = json.restaurant_name;
        cell2.innerHTML = json.rating;
        cell3.innerHTML = json.review ? json.review : "No Review Available";
        cell4.innerHTML = json.address;
        cell5.innerHTML = json.menu_item;
        cell6.innerHTML = json.opening_hours + "a.m - " + json.closing_hours + "p.m";
        cell7.innerHTML = json.delivery_available ? json.delivery_available : "N/A"; //TODO not correct


    }

</script>


</body>
</html>
